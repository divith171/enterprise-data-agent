                <h1 style="font-size: 32px; margin: 0 0 8px;">DataKat — Your AI Data Analyst</h1>
                <p style="color: #B6C6D6;">This page's demonstrations need JavaScript. The sample analysis below is available without it.</p>
                <h2 style="font-size: 22px; margin: 32px 0 8px;">Ask the question. Get the answer.</h2>
                <p><strong>Which region drove our growth last quarter?</strong> Growth means net revenue in this example. Q3 2026 compared with Q2 2026.</p>
                <p style="font-size: 20px;">West contributed $220k of the $400k increase — 55% of total revenue growth.</p>
                <table style="border-collapse: collapse; width: 100%; font-size: 14px;">
                    <thead><tr><th align="left">Region</th><th align="right">Q2 2026</th><th align="right">Q3 2026</th><th align="right">Change</th><th align="right">Contribution</th></tr></thead>
                    <tbody>
                        <tr><td>West</td><td align="right">$800,000</td><td align="right">$1,020,000</td><td align="right">+$220,000</td><td align="right">55.0%</td></tr>
                        <tr><td>North</td><td align="right">$700,000</td><td align="right">$820,000</td><td align="right">+$120,000</td><td align="right">30.0%</td></tr>
                        <tr><td>South</td><td align="right">$700,000</td><td align="right">$790,000</td><td align="right">+$90,000</td><td align="right">22.5%</td></tr>
                        <tr><td>East</td><td align="right">$600,000</td><td align="right">$570,000</td><td align="right">−$30,000</td><td align="right">−7.5%</td></tr>
                        <tr><td><strong>Total</strong></td><td align="right">$2,800,000</td><td align="right">$3,200,000</td><td align="right">+$400,000</td><td align="right">100.0%</td></tr>
                    </tbody>
                </table>
                <p style="color: #B6C6D6; font-size: 13px;">Illustrative demo · sample data. East declined by $30k, partially offsetting growth elsewhere.</p>
                <h2 style="font-size: 22px; margin: 32px 0 8px;">Connect. Ask. Analyze. Understand.</h2>
                <ol>
                    <li><strong>Connect your company's data.</strong> Start with a company-owned source. This example uses a sample PostgreSQL dataset.</li>
                    <li><strong>Ask in business language.</strong> Specify the question. Make the metric, period and comparison clear.</li>
                    <li><strong>Turn the question into a comparison.</strong> Compare complete periods, calculate the change and check the query before execution.</li>
                    <li><strong>See the answer and its evidence.</strong> West contributed 55% of the total increase. The comparison stays visible beside the explanation.</li>
                </ol>
                <h2 style="font-size: 22px; margin: 32px 0 8px;">Built for controlled analytical access.</h2>
                <p>Conceptual access path · sample request: Authenticated access → Query rate limit → Source ownership → Tenant-aware routing → SQL validation → Company-owned source. A source ownership mismatch stops at Source ownership: request denied.</p>
                <p style="font-size: 20px; margin-top: 32px;">Not another dashboard. Not another SQL editor. Not another chatbot. <strong>An analyst you can talk to.</strong></p>
                <p><strong>Your data already knows the answer. What do you want to know?</strong></p>
                <p><a href="/signup" style="color: #19CDE7;">Get Started</a> · <a href="/login" style="color: #F3F7FB;">Sign in</a></p>
